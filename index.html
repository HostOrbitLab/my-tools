<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HostOrbitLab - Free Online Tools</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.tool-box{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;padding:15px;overflow:auto}
.tool-content{background:white;max-width:500px;margin:30px auto;padding:20px;border-radius:20px}
</style>
</head>
<body class="bg-[#f8f9ff] font-sans">
<header class="bg-white p-4 text-center font-bold text-xl border-b">HostOrbitLab - 20+ Free Tools</header>

<div class="max-w-6xl mx-auto p-4">
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">

<div onclick="openTool('qr')" class="bg-white p-5 rounded-2xl border cursor-pointer"><div class="text-2xl">⚡</div><b>QR Generator</b><p class="text-xs text-gray-500">ON karo</p></div>
<div onclick="openTool('pass')" class="bg-white p-5 rounded-2xl border cursor-pointer"><div class="text-2xl">🔐</div><b>Password Gen</b><p class="text-xs text-gray-500">ON karo</p></div>
<div onclick="openTool('age')" class="bg-white p-5 rounded-2xl border cursor-pointer"><div class="text-2xl">🎂</div><b>Age Calculator</b><p class="text-xs text-gray-500">ON karo</p></div>
<div onclick="openTool('bmi')" class="bg-white p-5 rounded-2xl border cursor-pointer"><div class="text-2xl">⚖️</div><b>BMI Calculator</b><p class="text-xs text-gray-500">ON karo</p></div>
<div onclick="openTool('word')" class="bg-white p-5 rounded-2xl border cursor-pointer"><div class="text-2xl">🔢</div><b>Word Counter</b><p class="text-xs text-gray-500">ON karo</p></div>
<div onclick="openTool('case')" class="bg-white p-5 rounded-2xl border cursor-pointer"><div class="text-2xl">🔠</div><b>Case Converter</b><p class="text-xs text-gray-500">ON karo</p></div>
<div onclick="openTool('compress')" class="bg-white p-5 rounded-2xl border cursor-pointer"><div class="text-2xl">🗜️</div><b>Image Compressor</b><p class="text-xs text-gray-500">ON karo</p></div>
<div onclick="openTool('color')" class="bg-white p-5 rounded-2xl border cursor-pointer"><div class="text-2xl">🎨</div><b>Color Picker</b><p class="text-xs text-gray-500">ON karo</p></div>

</div>
</div>

<!-- TOOL POPUP -->
<div id="toolModal" class="tool-box" onclick="if(event.target==this)closeTool()">
<div class="tool-content">
<div class="flex justify-between mb-4"><h2 id="toolTitle" class="font-bold text-lg"></h2><button onclick="closeTool()" class="bg-black text-white w-8 h-8 rounded-full">X</button></div>
<div id="toolBody"></div>
<div class="mt-4 p-3 bg-yellow-50 border border-dashed rounded-lg text-center text-xs">AD SPACE - Yaha AdSense Ad ayega to kamai hogi</div>
</div>
</div>

<script>
function openTool(type){
 document.getElementById('toolModal').style.display='block';
 let title='', body='';
 if(type=='qr'){ title='QR Generator'; body=`<input id="qrText" placeholder="Link ya text dalo" class="w-full border p-3 rounded-xl"><button onclick="makeQR()" class="w-full bg-blue-600 text-white p-3 rounded-xl mt-3">Generate QR</button><div class="text-center mt-4"><img id="qrImg" class="mx-auto"></div>`; }
 if(type=='pass'){ title='Password Generator'; body=`<div class="flex gap-2"><input id="passLen" type="number" value="12" class="border p-3 rounded-xl w-20"><button onclick="makePass()" class="flex-1 bg-black text-white p-3 rounded-xl">Generate</button></div><input id="passOut" class="w-full border p-3 rounded-xl mt-3 font-mono" readonly>`; }
 if(type=='age'){ title='Age Calculator'; body=`<input id="dob" type="date" class="w-full border p-3 rounded-xl"><button onclick="calcAge()" class="w-full bg-black text-white p-3 rounded-xl mt-3">Calculate Age</button><p id="ageOut" class="mt-3 font-bold text-center"></p>`; }
 if(type=='bmi'){ title='BMI Calculator'; body=`<input id="h" placeholder="Height in cm" type="number" class="w-full border p-3 rounded-xl"><input id="w" placeholder="Weight in kg" type="number" class="w-full border p-3 rounded-xl mt-2"><button onclick="calcBMI()" class="w-full bg-black text-white p-3 rounded-xl mt-3">Calculate BMI</button><p id="bmiOut" class="mt-3 font-bold text-center"></p>`; }
 if(type=='word'){ title='Word Counter'; body=`<textarea id="wordIn" rows="5" placeholder="Yaha text likho..." class="w-full border p-3 rounded-xl" onkeyup="countWord()"></textarea><p id="wordOut" class="mt-2 text-sm"></p>`; }
 if(type=='case'){ title='Case Converter'; body=`<textarea id="caseIn" rows="4" class="w-full border p-3 rounded-xl"></textarea><div class="grid grid-cols-2 gap-2 mt-2"><button onclick="toUpper()" class="border p-2 rounded-xl">UPPER</button><button onclick="toLower()" class="border p-2 rounded-xl">lower</button></div>`; }
 if(type=='compress'){ title='Image Compressor'; body=`<input type="file" id="imgIn" accept="image/*" class="w-full"><canvas id="canvas" class="hidden"></canvas><button onclick="compressImg()" class="w-full bg-black text-white p-3 rounded-xl mt-3">Compress & Download</button><p class="text-xs text-center mt-2">100% browser me hota hai, server pe nahi jata</p>`; }
 if(type=='color'){ title='Color Picker'; body=`<input type="color" id="colorIn" value="#3b82f6" class="w-full h-20" oninput="document.getElementById('colorOut').innerText=this.value"><p id="colorOut" class="text-center font-mono font-bold mt-3">#3b82f6</p>`; }

 document.getElementById('toolTitle').innerText=title;
 document.getElementById('toolBody').innerHTML=body;
}
function closeTool(){ document.getElementById('toolModal').style.display='none'; }

function makeQR(){ let t=document.getElementById('qrText').value; if(!t)return alert('Text dalo'); document.getElementById('qrImg').src=`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(t)}`; }
function makePass(){ let len=document.getElementById('passLen').value; let chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%"; let p=""; for(let i=0;i<len;i++)p+=chars[Math.floor(Math.random()*chars.length)]; document.getElementById('passOut').value=p; }
function calcAge(){ let dob=new Date(document.getElementById('dob').value); let diff=Date.now()-dob.getTime(); let age=new Date(diff).getUTCFullYear()-1970; document.getElementById('ageOut').innerText="Age: "+age+" Years"; }
function calcBMI(){ let h=document.getElementById('h').value/100; let w=document.getElementById('w').value; let bmi=(w/(h*h)).toFixed(2); document.getElementById('bmiOut').innerText="BMI: "+bmi; }
function countWord(){ let t=document.getElementById('wordIn').value; document.getElementById('wordOut').innerText=`Words: ${t.split(/\s+/).filter(x=>x).length} | Chars: ${t.length}`; }
function toUpper(){ document.getElementById('caseIn').value=document.getElementById('caseIn').value.toUpperCase(); }
function toLower(){ document.getElementById('caseIn').value=document.getElementById('caseIn').value.toLowerCase(); }
function compressImg(){ let file=document.getElementById('imgIn').files[0]; if(!file)return alert('Image select karo'); let img=new Image(); img.onload=()=>{ let c=document.getElementById('canvas'); c.width=img.width*0.6; c.height=img.height*0.6; c.getContext('2d').drawImage(img,0,0,c.width,c.height); let a=document.createElement('a'); a.download='compressed.jpg'; a.href=c.toDataURL('image/jpeg',0.6); a.click(); }; img.src=URL.createObjectURL(file); }
</script>
</body>
</html>
